name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          # Fork PRs run untrusted code and must not populate shared dependency caches.
          cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          cache: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && 'pnpm' || '' }}
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Check Go formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal packaging test)"

      - name: Check Go code
        run: go vet ./...

      - name: Test Go
        shell: bash
        run: |
          mkdir -p output/test-results
          go test -json ./... > output/test-results/go-test.json

      - name: Test privileged Linux runner boundary
        run: ./scripts/test-platform-linux.sh

      - name: Check Web formatting, lint, and types
        run: |
          pnpm --dir web format:check
          pnpm --dir web lint
          pnpm --dir web typecheck

      - name: Test Web
        run: pnpm --dir web test:ci

      - name: Build Web
        run: pnpm --dir web build

      - name: Install actionlint
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "${GOBIN}" >> "${GITHUB_PATH}"

      - name: Lint workflows
        run: actionlint

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-failure-${{ github.run_attempt }}
          path: |
            output/test-results/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 3

  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}

      - name: Test
        run: go test ./...

      - name: Build controller
        run: go build -trimpath ./cmd/tewake

      - name: Build agent
        run: go build -trimpath ./cmd/tewake-agent

  cross-build:
    name: Cross-build (all supported targets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}

      - name: Cross-build controller and agent for every supported target
        run: ./scripts/cross-build.sh

  required:
    name: ci/required
    if: ${{ always() }}
    needs:
      - quality
      - go
      - cross-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce required quality gates
        shell: bash
        run: |
          test "${{ needs.quality.result }}" = success
          test "${{ needs.go.result }}" = success
          test "${{ needs.cross-build.result }}" = success
