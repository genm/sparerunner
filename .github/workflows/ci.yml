name: CI

# CONTRIBUTING.md asks contributors to open pull requests as Draft and to attach
# acceptance evidence there, so this workflow deliberately does NOT skip draft
# pull requests. The draft state is where the evidence is produced, not a state
# where feedback is unwanted. Standard runners are free for public repositories,
# so the cost of that choice is wall-clock only.
on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A merge_group ref is unique per queue entry, so it never collides and never
  # cancels a queued merge. Only pushes to main are protected explicitly.
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  # A prose-only pull request does not need three operating systems, two browser
  # engines, and a cross-compile of every target. This job decides that once, and
  # only for pull requests: pushes to main, merge queue entries, and every other
  # event fall through to running everything, so the skip can never be the reason
  # an untested tree reaches main.
  changes:
    name: Detect what changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether the code gates need to run
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" != pull_request ]; then
            echo "code=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # Three dots: the diff against the merge base, so a pull request does
          # not inherit whatever landed on main after it was opened.
          if ! changed="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" 2>&1)"; then
            printf 'could not diff against the base, running every gate:\n%s\n' \
              "${changed}" >&2
            echo "code=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          printf 'changed files:\n%s\n' "${changed}"
          # Prose only. Everything else — .github, scripts, packaging, and the Go
          # that lives under spec/ — is code as far as this gate is concerned, and
          # an empty diff also lands here, so the fallthrough is always "run it".
          if printf '%s\n' "${changed}" | grep -qvE '(^docs/|\.md$)'; then
            echo "code=true" >> "${GITHUB_OUTPUT}"
          else
            echo "code=false" >> "${GITHUB_OUTPUT}"
          fi

  # Cheapest signal first: nothing here needs a language toolchain, so a broken
  # workflow or shell script reports in about a minute instead of behind a
  # fifteen-minute test run. Not gated on `changes` — it is a minute, it scans
  # history for secrets, and a documentation commit can still carry one.
  static:
    name: Static analysis (workflows and shell)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Full history so the secret scan can see a credential that was committed
      # and then removed. This repository is small enough that the unshallow
      # fetch costs seconds.
      - name: Check out repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: actionlint shellcheck gitleaks
          # Fork pull requests run untrusted code and must not populate shared caches.
          cache_save: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}

      - name: Lint workflows
        run: actionlint

      - name: Audit workflows for supply-chain and injection patterns
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          # Pinned to the same version .mise.toml installs, so `just lint`
          # applies exactly the rules this gate applies. The Action's own
          # default is `latest`, which drifts.
          version: 1.28.0
          # zizmor's own SARIF upload needs security-events: write, which a fork
          # pull request cannot have. Failing the job keeps the signal blocking
          # and identical for every contributor.
          advanced-security: false
          persona: regular

      - name: Lint shell scripts
        run: >-
          shellcheck --severity=style
          scripts/*.sh
          packaging/macos/*.sh
          test/live/linux/run.sh
          test/live/macos/run.sh

      # GitHub secret scanning and push protection are enabled and cover
      # provider-issued credentials. This covers this project's own secret
      # shapes — join codes, JIT payloads, node keys, session secrets — which no
      # provider pattern knows about.
      - name: Scan history for committed secrets
        run: gitleaks git --redact --exit-code 1 --config .gitleaks.toml

  generated:
    name: Generated contracts
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && 'pnpm' || '' }}
          cache-dependency-path: |
            api/codegen/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Install Web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Install API codegen dependencies
        run: pnpm --dir api/codegen install --frozen-lockfile

      - name: Check generated API and embedded Web UI
        run: |
          ./scripts/check-generated-api.sh
          ./scripts/check-generated-web.sh

  go-quality:
    name: Go quality
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Same reason `cross-build` opts out: setup-go keys on runner OS plus
          # go.sum, so every ubuntu Go job competes for one key and only the
          # first to finish saves. This job compiles a test binary for every
          # package, which no faster job does, so that work was never the copy
          # that got kept.
          cache: false

      # Keyed on the module graph, not the source. The Go build cache is
      # content-addressed, so an entry for changed source is unused rather than
      # wrong, and what this keeps warm is the standard library, the module
      # dependencies, and every package that did not change.
      - name: Cache the test build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}

      # Naming the files is the difference between a fixable failure and a
      # one-line "exit code 1".
      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l cmd internal packaging test)"
          if [ -n "${unformatted}" ]; then
            printf 'these files are not gofmt-formatted, run "just fmt":\n%s\n' \
              "${unformatted}" >&2
            exit 1
          fi

      # tidy proves the manifest is internally consistent; verify proves the
      # downloaded content still hashes to what go.sum records.
      - name: Verify module content against go.sum
        run: go mod verify

      - name: Check that go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # No `go vet ./...` here. The `go-lint` job runs golangci-lint with
      # `govet: enable-all` (minus fieldalignment and shadow) across
      # GOOS=linux/darwin/windows, so a host-only vet is a strict subset of a
      # check that already runs three times.

      # gotestsum streams a readable per-package result to the log and expands the
      # failing test inline, while still writing the machine-readable evidence.
      # Redirecting `go test -json` to a file instead leaves a failed run showing
      # nothing but the exit code.
      - name: Test Go
        shell: bash
        run: |
          mkdir -p output/test-results
          go tool gotestsum \
            --format github-actions \
            --format-hide-empty-pkg \
            --junitfile output/test-results/go-junit.xml \
            --jsonfile output/test-results/go-test.json \
            -- ./...

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-quality-failure-${{ github.run_attempt }}
          path: output/test-results/
          if-no-files-found: ignore
          retention-days: 3

  go-lint:
    # Platform adapters carry the trust boundary on each OS, and 46 files —
    # including the Windows job-object, ACL, and macOS Keychain code — never
    # compile on Linux, so a host-only lint run never parses them. golangci-lint
    # only type-checks, so cross-compiling all three targets on one free ubuntu
    # runner covers them without spending macOS or Windows runner time.
    name: Lint Go (GOOS=${{ matrix.goos }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos:
          - linux
          - darwin
          - windows
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}

      - name: Lint Go code
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        with:
          # Keep this in step with the golangci-lint pin in .mise.toml, which is
          # what `just lint` uses locally.
          version: v2.12.2
          # cmd/sparerunner-tray needs cgo and each OS's own native toolchain
          # (systray's darwin backend is Objective-C behind cgo), so it is
          # excluded from every cross-compiled cross-build.sh target for the
          # same reason and built only natively via `just build-tray`. Confirmed
          # in a container that both CGO_ENABLED=0 and =1 still fail to
          # typecheck it under GOOS=darwin on a Linux host — this is not a
          # CGO_ENABLED toggle, cross-compiling it is simply not possible here.
          args: >-
            ./cmd/sprun/... ./cmd/sparerunner-agent/... ./internal/...
            ./packaging/... ./test/... ./spec/...

  go-race:
    # Scoped on purpose. Measured on this tree with `go test -race -count=1`:
    # internal/reconcile 3.5s, internal/scheduler 6.5s, internal/nodectl 5.6s,
    # internal/github 8.0s, internal/transport 22.1s — about 45s for the packages
    # that own the controller's concurrency. The two that are excluded are the
    # reason this is not `./...`: internal/app takes 471s under the detector and
    # internal/store is already 240s without it, so a whole-module race run blows
    # Go's 10-minute default per-package timeout before a 4-vCPU runner is even
    # considered. Bringing those two under the detector is worth its own task.
    name: Go race detector (concurrency-owning packages)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}

      - name: Test with the race detector
        shell: bash
        run: |
          mkdir -p output/test-results
          go tool gotestsum \
            --format github-actions \
            --format-hide-empty-pkg \
            --junitfile output/test-results/go-race-junit.xml \
            --jsonfile output/test-results/go-race.json \
            -- -race -timeout=15m \
            ./internal/reconcile/... \
            ./internal/scheduler/... \
            ./internal/transport/... \
            ./internal/nodectl/... \
            ./internal/github/...

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-race-failure-${{ github.run_attempt }}
          path: output/test-results/
          if-no-files-found: ignore
          retention-days: 3

  govulncheck:
    name: Go vulnerability scan
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}

      - name: Install govulncheck
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          echo "${GOBIN}" >> "${GITHUB_PATH}"

      # Reports only advisories that are reachable from this module's own code
      # paths, so a finding here is actionable rather than a dependency-graph
      # notification.
      - name: Scan for reachable vulnerabilities
        run: govulncheck ./...

  go-platform:
    name: Privileged Linux runner boundary
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}

      - name: Test privileged Linux runner boundary
        run: ./scripts/test-platform-linux.sh

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-platform-failure-${{ github.run_attempt }}
          path: output/test-results/
          if-no-files-found: ignore
          retention-days: 3

  web:
    name: Web quality
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && 'pnpm' || '' }}
          cache-dependency-path: web/pnpm-lock.yaml

      # Before any install, so a broken policy cannot be masked by a successful
      # one. Covers api/codegen too, which installs in the `generated` job.
      - name: Check the npm supply-chain policy is in effect
        run: ./scripts/check-npm-policy.sh

      - name: Install Web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Check Web formatting, lint, and types
        run: |
          pnpm --dir web format:check
          pnpm --dir web lint
          pnpm --dir web typecheck

      - name: Test Web
        run: pnpm --dir web test:ci

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-failure-${{ github.run_attempt }}
          path: output/test-results/
          if-no-files-found: ignore
          retention-days: 3

  raycast:
    name: Raycast extension
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This extension uses npm, not pnpm, because that is what the Raycast
      # publishing pipeline expects.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && 'npm' || '' }}
          cache-dependency-path: extensions/raycast/package-lock.json

      # --ignore-scripts because nothing here needs a package's install hook, and
      # this is the one place in the repository that resolves from npm rather
      # than the age-quarantined pnpm path.
      - name: Install extension dependencies
        run: npm --prefix extensions/raycast ci --ignore-scripts

      # `ray lint` and `ray build` need the Raycast app and therefore macOS, but
      # typechecking does not. It is what catches the extension drifting from the
      # node control contract it speaks.
      - name: Typecheck the extension
        run: npm --prefix extensions/raycast run typecheck

  web-components:
    name: Web component tests
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && 'pnpm' || '' }}
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Web dependencies
        run: pnpm --dir web install --frozen-lockfile

      # The lockfile determines which Playwright version resolves, and the
      # version determines which browser build is downloaded, so keying on the
      # lockfile hash can never serve a browser that does not match the client.
      #
      # Unlike the setup-go and setup-node caches above, this one is left on for
      # fork pull requests: Actions scopes a cache written by a fork run to that
      # pull request's own ref, so it cannot reach the base repository.
      - name: Restore the Playwright browser cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --dir web exec playwright install --with-deps chromium

      # The cached browser archive does not carry the apt packages Chromium needs.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --dir web exec playwright install-deps chromium

      - name: Test Web components
        run: pnpm --dir web test:ct

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-components-failure-${{ github.run_attempt }}
          path: |
            output/test-results/
            output/playwright/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 3

  browser-journey:
    name: Management journey in a real browser
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && 'pnpm' || '' }}
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Web dependencies
        run: pnpm --dir web install --frozen-lockfile

      # Deliberately uncached, unlike `web-components`. Measured on this job: the
      # whole step is 22s, and caching the browser leaves 21s of `install-deps`
      # apt work behind. The browser archive is about a second of it, and a 269
      # MiB cache entry is not worth a second.
      - name: Install Playwright Chromium
        run: pnpm --dir web exec playwright install --with-deps chromium

      # The Web UI is embedded from internal/webui/assets, which the `generated`
      # job proves is current, so this needs no Vite build.
      - name: Build release binary for browser verification
        run: go build -trimpath -o "${RUNNER_TEMP}/sprun" ./cmd/sprun

      - name: Test critical management journey in a real browser
        run: ./scripts/test-management-ui-linux.sh "${RUNNER_TEMP}/sprun"

      - name: Smoke embedded Web UI from the release binary
        run: |
          mkdir -p output/test-results
          ./scripts/smoke-embedded-ui.sh \
            "${RUNNER_TEMP}/sprun" \
            output/test-results/embedded-ui-smoke.json

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-journey-failure-${{ github.run_attempt }}
          path: |
            output/test-results/
            output/playwright/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 3

  go:
    # Linux is deliberately absent. `go-quality` already runs the identical
    # `gotestsum -- ./...` on ubuntu-24.04, and `cross-build` already builds
    # linux/amd64 and linux/arm64 for both commands, so an ubuntu leg here was a
    # second copy of two checks that were already blocking — about two minutes of
    # runner time per run for no additional coverage. macOS and Windows stay,
    # because their platform adapters only compile and only run there.
    name: Go (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}

      # No -race here, and none in go-quality either. It was measured on this
      # tree: internal/store alone takes 240s without the detector, and ~3x that
      # with it, which blows Go's 10-minute default per-package timeout before a
      # 4-vCPU runner is even considered. Turning it on would make the required
      # gate red on arrival and teach everyone to ignore it. Getting the
      # controller's concurrent reconcile, session, and dispatch loops under the
      # detector is worth doing, but it needs its own scoped job over the
      # concurrency-owning packages with a measured timeout — not a flag added
      # here.
      - name: Test
        shell: bash
        run: |
          mkdir -p output/test-results
          go tool gotestsum \
            --format github-actions \
            --format-hide-empty-pkg \
            --junitfile "output/test-results/go-junit-${{ matrix.os }}.xml" \
            --jsonfile "output/test-results/go-test-${{ matrix.os }}.json" \
            -- ./...

      # The Windows enrollment bootstrap pipe is single-instance by design, so a
      # test that leaks its server makes later tests fail with
      # ErrBootstrapUnavailable. Repeating them is what actually exposes that
      # class of leak; a single pass does not. The filter keeps the repetition on
      # the pipe tests so this step cannot multiply an unrelated flake.
      - name: Stress Windows enrollment bootstrap pipe tests
        if: runner.os == 'Windows'
        run: >-
          go test -count=20
          -run 'Bootstrap|TestSubmitRejectsPipeServerThatIsNotLocalSystemService'
          ./internal/platform/windows/

      - name: Build controller
        run: go build -trimpath ./cmd/sprun

      - name: Build agent
        run: go build -trimpath ./cmd/sparerunner-agent

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-${{ matrix.os }}-failure-${{ github.run_attempt }}
          path: output/test-results/
          if-no-files-found: ignore
          retention-days: 3

  cross-build:
    name: Cross-build (all supported targets)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # setup-go derives its cache key from the runner OS and go.sum, so every
          # Go job on ubuntu competes for one key and only the first to finish
          # saves. This is the slowest of them and the only one that compiles a
          # standard library for darwin and windows, so under the shared key its
          # cross-compiled output was never the copy that got kept. It owns its
          # cache below instead.
          cache: false

      # Keyed on the module graph, not the source: the Go build cache is
      # content-addressed, so entries for changed source are simply unused rather
      # than wrong, and what this is really keeping warm is six platforms' worth
      # of standard library. Actions scopes a cache written by a fork run to that
      # pull request's own ref, so it cannot reach the base repository.
      - name: Cache the cross-compilation build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-cross-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - name: Cross-build controller and agent for every supported target
        run: ./scripts/cross-build.sh

  required:
    name: ci/required
    if: ${{ always() }}
    needs:
      - changes
      - static
      - generated
      - go-quality
      - go-lint
      - go-race
      - govulncheck
      - go-platform
      - web
      - web-components
      - browser-journey
      - raycast
      - go
      - cross-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Fails closed: failure and cancelled always leave the required check red.
      # `skipped` is accepted only when the `changes` job established that this
      # pull request touches nothing but prose — so on any code change the gate
      # is exactly as strict as it was before, and a job that skips because
      # someone broke its `if` is still red. Job results are a closed enum
      # produced by Actions, not contributor-controlled text.
      - name: Enforce required quality gates
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: |
          echo "job results: ${RESULTS} (code changed: ${CODE_CHANGED})"
          for result in ${RESULTS}; do
            case "${result}" in
              success) ;;
              skipped)
                if [[ "${CODE_CHANGED}" != false ]]; then
                  echo "a required job was skipped on a code change" >&2
                  exit 1
                fi
                ;;
              *)
                echo "a required job did not succeed: ${result}" >&2
                exit 1
                ;;
            esac
          done
