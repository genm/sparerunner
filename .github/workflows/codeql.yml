name: CodeQL

# Code scanning is free for public repositories. This runs the analysis on every
# pull request so a finding lands as review feedback, and on a weekly schedule so
# a newly published query catches code that has not changed since it was written.
#
# Only Markdown is exempt from change-triggered analysis. A directory named
# docs can also contain executable examples or scripts, so ignoring docs/**
# would silently exclude those changes. ci.yml owns required-check reporting
# independently; CodeQL is not a required check.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
  schedule:
    # Monday 04:17 UTC. Off the hour so the run does not queue behind the burst
    # of workflows every other repository schedules at :00.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  # Separate scheduled/manual full scans from push baselines. Even with
  # cancel-in-progress disabled, a shared group can replace a pending run.
  group: codeql-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # internal/webui/assets is committed and verified by
          # scripts/check-generated-web.sh, so the Go build needs no pnpm step.
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Fork PRs run untrusted code and must not populate shared dependency caches.
          cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:${{ matrix.language }}
