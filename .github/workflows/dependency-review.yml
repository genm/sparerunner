name: Dependency review

# Blocks a pull request that introduces a dependency with a known advisory or an
# incompatible licence. Free for public repositories.
#
# This compares the pull request's dependency graph against its base, so it is
# inherently a pull_request check and has no merge_group equivalent.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # SpareRunner redistributes its dependencies inside release archives
          # under Apache-2.0, so a copyleft or source-available addition is a
          # release blocker rather than a review note. Denying is the fail-closed
          # choice; a genuinely needed exception is added here deliberately.
          deny-licenses: >-
            AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later,
            GPL-1.0-only, GPL-1.0-or-later, GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later,
            LGPL-2.0-only, LGPL-2.0-or-later, LGPL-2.1-only, LGPL-2.1-or-later,
            LGPL-3.0-only, LGPL-3.0-or-later,
            SSPL-1.0, BUSL-1.1, Elastic-2.0
          fail-on-severity: low
          # The findings are written to the job summary. Posting a pull request
          # comment would need write access that a fork's token does not have,
          # and a check that only works for branch pull requests is worse than
          # one that reports the same way for everyone.
          comment-summary-in-pr: never
