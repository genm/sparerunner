# The network-facing Agent has no login shell or privileged group membership.
# Each concrete runner slot has a different non-login identity.
u tewake-agent - "Tewake node agent" /var/lib/tewake-agent /usr/sbin/nologin
u tewake-runner-0 - "Tewake native runner slot 0" /var/lib/tewake-runner/0 /usr/sbin/nologin
