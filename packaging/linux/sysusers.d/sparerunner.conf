# The network-facing Agent has no login shell or privileged group membership.
# Each concrete runner slot has a different non-login identity.
u sparerunner-agent - "SpareRunner node agent" /var/lib/sparerunner-agent /usr/sbin/nologin
u sparerunner-runner-0 - "SpareRunner native runner slot 0" /var/lib/sparerunner-runner/0 /usr/sbin/nologin
