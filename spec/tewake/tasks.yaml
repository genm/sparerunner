version: 1
feature: tewake

tasks:
  - id: twk-001
    title: Bootstrap the OSS repository and specification
    type: foundation
    description: >
      Create the repository, Apache-2.0 license, project instructions, spec pack,
      Go and Web scaffolds, reproducible toolchain, and cross-platform CI.
    depends_on: []
    paths:
      - .github
      - .editorconfig
      - .gitignore
      - .mise.toml
      - .npmrc
      - AGENTS.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - LICENSE
      - README.md
      - SECURITY.md
      - cmd/tewake
      - cmd/tewake-agent
      - go.mod
      - go.sum
      - internal/buildinfo
      - internal/webui
      - justfile
      - lefthook.yml
      - process-compose.yaml
      - spec/tewake
      - web
      - scripts/cross-build.sh
