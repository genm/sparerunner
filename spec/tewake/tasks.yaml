  - id: twk-018
    title: Ship the Raycast launcher extension
    type: frontend
    description: >
      Build the optional macOS Raycast extension over the versioned CLI contract,
      with status view, pause and resume commands, CLI resolution and compatibility
      checks, and no stored controller credential.
    depends_on: [twk-008, twk-016]
    paths:
      - extensions/raycast
      - docs/integrations
    ci_targets: [lint, typecheck, test, build]
    pr_order: 19
    status: todo
    notes: >
      Ordered after the first release because Raycast is macOS-only, optional, and
      its store publication is an external review step. It gates no Tewake artifact.
    acceptance:
      - Pause and resume from Raycast produce the same effective state as the tray, the CLI, and the Web UI.
      - Unreachable agent, stale observation, pending resume, and quarantine render as distinct explicit states and never as accepting or idle.
