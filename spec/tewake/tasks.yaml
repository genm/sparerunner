      - internal/api
      - internal/app
      - internal/github
      - internal/platform
      - internal/store
      - cmd/tewake
      - web
      - test/contract/github
    ci_targets: [lint, typecheck, test, build, e2e]
    pr_order: 14
    status: in_progress
    notes:
      - "2026-07-27: Added signed one-use Manifest manager, controller-owned credential store boundary, GitHub App JWT/installation/private-scope/runner-group verification adapter, provisioning-intent migration, optional management API routes, generated API types, and Setup/Target UI. Local Go/Vitest (24 tests)/Playwright CT (24 tests)/typecheck/race/build gates pass; live GitHub sandbox and native macOS/Windows credential adapters remain pending for TWK-014/008/009."
