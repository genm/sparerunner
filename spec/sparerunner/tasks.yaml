  - id: spr-016
    title: Implement node availability control
    type: backend
    description: >
      Add the durable node-local availability intent, the same-host agent control
      endpoint with OS peer authorization, protocol reporting, scheduler
      enforcement, the shared API/CLI availability mutation, and the versioned
      machine-readable CLI document that desktop clients integrate against.
    depends_on: [spr-010, spr-012]
    paths:
      - internal/nodectl
      - internal/agent
      - internal/scheduler
      - internal/transport
      - internal/api
      - cmd/sprun
      - cmd/sparerunner-agent
    ci_targets: [lint, test, build]
    pr_order: 15
    status: in_progress
    notes:
      - "2026-07-27: Durable intent, the same-host endpoint with kernel-verified peer authorization, agent readiness conjunction, transport reporting, and the versioned CLI document are implemented. `scripts/test-node-availability-linux.sh` proves stop, restart durability, pending resume until controller acknowledgement, offline stop, and endpoint refusal without --local-control against real controller, agent, and CLI binaries in a restricted container."
      - "2026-07-27: Remaining for acceptance: the Windows named-pipe endpoint with an explicit DACL fails closed today, the controller does not yet persist an audit event per availability change, and the management API and Web UI do not yet expose the reported intent as a distinct field."
      - "2026-07-29: The availability audit event and the distinct reported-intent field landed with spr-019, so the Windows endpoint was the last open item of that note. It is now implemented: `internal/nodectl/endpoint_windows.go` serves the contract over a named pipe whose name is a digest of the absolute state directory, because Windows pipes live in a flat kernel namespace and cannot sit inside that directory. The DACL is protected, owned by the serving account, and grants that account full control plus FILE_GENERIC_READ/WRITE to each explicitly named owner SID; an owner string that does not parse fails startup rather than being dropped, so the endpoint can never be narrower than the operator was told. Creation refuses to join an existing pipe, so a squatted name cannot become the control surface. `--owner-sid` is the Windows counterpart of `--owner-uid`, and the same principal list becomes both the DACL and the per-connection allowlist, so an account is never reachable without being authorized or authorized without being reachable."
      - "2026-07-29: `PeerIdentity` reads the client PID from the pipe and resolves its token SID, the same idiom `validateBootstrapClient` already uses, so Windows has one peer-identity pattern rather than two. `Peer` gains a `SID` field because Unix UIDs and Windows SIDs have no common principal type; UID stays -1 on Windows and SID stays empty on Unix. PID reuse between connect and the token read is the known ceiling and is recorded at the call site: the protected DACL, not the PID lookup, is the access boundary, and ImpersonateNamedPipeClient is the upgrade path."
      - "2026-07-29: `github.com/Microsoft/go-winio` v0.6.2 was added for the named-pipe listener. It is the only new module and adds no transitive dependency beyond `golang.org/x/sys`, which the repository already pins. Hand-rolling overlapped named-pipe I/O was rejected: `net.Conn` deadlines over a synchronous pipe handle need CancelIoEx plumbing that only ever executes on Windows CI, and RequestTimeout must actually bound an exchange rather than silently return ErrNoDeadline."
      - "2026-07-29: Verified on Linux: `just lint-go` reports 0 issues, `just test-go` passes 1,656 tests with 34 skips and 0 failures, gofmt is clean, and `just build-all` passes all twelve targets. The new Windows tests type-check under `GOOS=windows go vet` but have not executed; the DACL, the peer SID lookup, the duplicate-endpoint refusal, and the unauthorized-peer refusal need the hosted Windows CI leg, and the tray and Raycast surfaces against this endpoint remain live spr-017/spr-018 evidence."
      - "2026-07-28: Per-target control and display (the deny-list, eligible-Target list, and fail-closed exec-boundary backstop) is specified and tracked separately as spr-019, not part of this task's acceptance."
    acceptance:
      - A stopped node receives no execution and remains stopped across agent service restart and reboot.
      - Stopping during a running job leaves the job running and passes normal verified cleanup.
      - Without a controller session, stopping applies locally and resuming reports pending instead of accepting.
      - Controller Draining, Quarantined, and Revoked override a local Accepting intent.
      - An unauthorized or unidentifiable local control peer is refused with no state change and an audit event.
      - The control endpoint exposes no execution logs, JIT material, tokens, certificates, or join codes.
      - "`sprun node status|pause|resume --json` emits a versioned non-secret document covering intent, pending, connection state, observation age, and running executions, and every failure exits non-zero with a machine-readable error class."

