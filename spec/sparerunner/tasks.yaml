      lists, logs, and OS state where the long name is the point.
    depends_on: [spr-022]
    paths:
      - spec/sparerunner
      - .claude/skills
      - README.md
      - docs
      - cmd/sprun
      - .goreleaser.yaml
      - justfile
      - scripts
      - packaging
      - extensions/raycast
      - test/live
      - web
    ci_targets: [lint, typecheck, test, build]
    pr_order: 23
    status: in_progress
    notes:
      - "`sprun` contracts SPAre RUNner instead of abbreviating it. `spr` was rejected as a common three-letter abbreviation that collides and searches poorly, and `srun` as Slurm's job-launch command."
      - "Shipping `sprun` as a second binary beside `sparerunner` was rejected. It would not shorten the CLI, only add one, and it would duplicate the controller artifact and its signing and attestation surface on every supported platform. No unit in `packaging/` runs the controller as an OS service, so renaming the binary an operator invokes by hand does not cost process-list clarity; the Agent, which does run as a service, keeps `sparerunner-agent`."
      - "2026-07-28: `scripts/cross-build.sh` builds `./cmd/$command` from a name list, so it does not contain the literal string `cmd/sparerunner` and was missed by the path search. `just check` does not run the cross-build matrix, so it only failed in CI. `just build-all` now passes for all twelve targets and is part of this task's verification."
      - "The command surface is unchanged. `invite`, `jobs`, `status`, `doctor`, `dashboard`, and a `machines` vocabulary were raised alongside the short name and deliberately not implemented here: the first four do not exist, and `Machine` conflicts with the Node/GitHub Target/Runner Profile vocabulary that spr-022 settled."
    acceptance:
      - The built controller binary is `sprun`, and no build, script, packaging file, or workflow still refers to a `sparerunner` controller binary.
      - Help output, the join-code instruction the controller prints, and every error that tells the operator what to run next name `sprun`.
      - The runner label, scale-set name, configuration directory, containment scope, mDNS service, and launchd label are unchanged, so an enrolled node and a configured Target keep working across the rename.
      - The Raycast extension finds the renamed binary in the standard install locations.
      - The repository agent skill documents only commands that exist, and its examples run against the real CLI.

  - id: spr-024
    title: Implement the sprun doctor diagnosis command
    type: backend
    description: >
      Add a read-only `sprun doctor` command that composes the existing
      management, health, and nodectl read surfaces into one fail-closed report
      with explicit pass, fail, and unavailable findings, a versioned `--json`
      document, and machine-readable error classes. The command introduces no
      new API surface and no new privilege.
    depends_on: [spr-012, spr-016, spr-020]
    paths:
      - spec/sparerunner
      - cmd/sprun
      - .claude/skills
    ci_targets: [lint, test, build]
    pr_order: 24
    status: in_progress
    notes:
      - "Promoted from Future Direction: the original product definition proposed a doctor command, and spr-023 recorded that it was raised and deliberately deferred rather than rejected."
      - "2026-07-29: `sprun doctor` composes controller-state presence, one owner session proving the loopback listener and the overview read, the setup read model for GitHub authority with condition codes, and the nodectl status contract. Deterministic tests cover healthy, disconnected-GitHub, degraded/conditioned, unreachable-listener, uninitialized-controller, and dead-agent-endpoint paths. A pass-path run against a live enrolled agent remains open before the task is done."
    acceptance:
